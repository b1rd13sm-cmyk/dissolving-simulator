<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M5%203v23q0%203%203%203h16q3%200%203-3V3%22%20fill%3D%22%23dcf4f9%22%20stroke%3D%22%23087fa6%22%20stroke-width%3D%222%22/%3E%3Cg%20fill%3D%22%230784c4%22%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2212%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2212%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2211%22%20cy%3D%2222%22%20r%3D%222%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2222%22%20r%3D%222%22/%3E%3C/g%3E%3C/svg%3E"><title>物質が水にとけていくシミュレーション</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#edf5f7;color:#18343d}.app{max-width:1280px;height:100vh;margin:auto;padding:8px 16px;display:flex;flex-direction:column;overflow:hidden}h1{text-align:center;margin:0 0 2px;font-size:clamp(22px,2.2vw,31px);line-height:1.1}.sub{text-align:center;color:#607881;margin-bottom:7px;font-size:14px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}.card,.controls{background:#fff;border-radius:20px;box-shadow:0 8px 28px #17333d18}.card{padding:9px;display:flex;flex-direction:column;min-height:0}.card h2{text-align:center;margin:0 0 4px;font-size:19px;line-height:1.15}.stage{height:auto;flex:1;min-height:0;position:relative;border-radius:15px;overflow:hidden;background:linear-gradient(#fbfeff,#edf9fc)}canvas{width:100%;height:100%;display:block}.legend{text-align:center;color:#647d86;font-size:12px;margin-top:3px;line-height:1.2}.controls{margin-top:8px;padding:8px 12px;flex:0 0 auto}.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:750;background:#087fa6;color:#fff;cursor:pointer}button.alt{background:#dcecef;color:#244b58}button:disabled{opacity:.38;cursor:not-allowed}.day{font-size:22px;font-weight:850;min-width:125px;text-align:center}input{width:min(720px,92%);display:block;margin:7px auto 2px}.ticks{max-width:720px;margin:auto;display:flex;justify-content:space-between;color:#69828b;font-size:12px}.msg{text-align:center;font-weight:750;min-height:18px;margin:4px 0 0;font-size:13px}@media(max-width:800px){.panels{grid-template-columns:1fr}.stage{height:350px}}</style></head><body><main class="app"><h1>物質が水にとけていくようす</h1><div class="sub">粒子モデルと実物風モデルを、同じ時間の経過で比べよう</div><div class="panels"><section class="card"><h2>粒子モデル</h2><div class="stage"><canvas id="p"></canvas></div><div class="legend">青い丸＝溶ける物質の粒子（水の粒子は省略）</div></section><section class="card"><h2>実物風モデル</h2><div class="stage"><canvas id="r"></canvas></div><div class="legend">底にある物質が少しずつ見えなくなり、水全体へ広がる</div></section></div><section class="controls"><div class="row"><button class="alt" id="reset">最初に戻す</button><button id="prev">◀ 1日前</button><div class="day" id="label">0日目</div><button id="next">1日後 ▶</button><button id="play">▶ 自動再生</button></div><input id="slider" type="range" min="0" max="15" step="1" value="0"><div class="ticks"><span>0日</span><span>3日</span><span>6日</span><span>9日</span><span>12日</span><span>15日</span></div><p class="msg" id="msg"></p></section></main><script>
const P=document.querySelector('#p'),R=document.querySelector('#r'),pc=P.getContext('2d'),rc=R.getContext('2d');const slider=document.querySelector('#slider'),label=document.querySelector('#label'),msg=document.querySelector('#msg');let day=0,timer=null;const N=50;
// 初期状態：底に横長い3段。上段から順に「底の塊を離れ」、それぞれの最終位置へ直線移動する。
const pts=Array.from({length:N},(_,i)=>{
  const cols=17, col=i%cols, row=Math.floor(i/cols);
  const sx=.105+col*(.79/(cols-1)), sy=.935-row*.052;

  // 最終位置：水の範囲全体に「完全な等間隔」の格子状で配置する。
  // 10列×5段＝50粒子。縦横とも一定間隔で、15日目には均一な分布になる。
  // 粒子番号を入れ替えて割り当て、移動中に中央へ集中しにくくする。
  const fcols=10, frows=5;
  const slot=(i*17)%N; // 17と50は互いに素なので全50位置を重複なく使う
  const fc=slot%fcols, fr=Math.floor(slot/fcols);
  const tx=.12+fc*(.76/(fcols-1));
  const ty=.18+fr*(.66/(frows-1));

  // 上段(row=2)→中段(row=1)→下段(row=0)。同じ段でも端から中央まで少しずつ開始をずらす。
  // delay は「15日間のうち、いつ動き始めるか」を表す。
  const layer=2-row;
  const within=((col*7)%17)/17;
  const delay=.035 + layer*.205 + within*.125;
  return {sx,sy,tx,ty,delay};
});
// 全粒子の移動時間を同じにする。したがって直線上を進む速さ（全行程に対する割合）も同じ。
const MOVE_DURATION=.46;
function fit(c){let d=devicePixelRatio||1,b=c.getBoundingClientRect();c.width=Math.round(b.width*d);c.height=Math.round(b.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[b.width,b.height]}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function vessel(ctx,w,h){let x=w*.12,y=h*.07,bw=w*.76,bh=h*.84;ctx.save();ctx.lineWidth=3;ctx.strokeStyle='#7fa4b1';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+9,y+bh-15);ctx.quadraticCurveTo(x+11,y+bh,x+31,y+bh);ctx.lineTo(x+bw-31,y+bh);ctx.quadraticCurveTo(x+bw-11,y+bh,x+bw-9,y+bh-15);ctx.lineTo(x+bw,y);ctx.stroke();ctx.strokeStyle='#9bb9c3';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x+bw/2,y,bw/2,9,0,0,Math.PI*2);ctx.stroke();ctx.restore();return{x:x+10,y:y+9,w:bw-20,h:bh-12}}
function particle(){
 let[w,h]=fit(P);pc.clearRect(0,0,w,h);let b=vessel(pc,w,h);
 pc.fillStyle='rgba(220,244,249,.62)';pc.fillRect(b.x,b.y,b.w,b.h);
 let prog=day/15;
 pts.forEach(q=>{
   // 開始前は底に静止。開始した瞬間から、自分の最終位置へ一直線に進む。
   // 全粒子で MOVE_DURATION が同じなので、途中で中央に『たまる』待機は起こらない。
   let local=prog>=1 ? 1 : Math.max(0,Math.min(1,(prog-q.delay)/MOVE_DURATION));
   let x=b.x+b.w*(q.sx+(q.tx-q.sx)*local), y=b.y+b.h*(q.sy+(q.ty-q.sy)*local);
   let rad=Math.max(5,Math.min(w,h)*.0175),g=pc.createRadialGradient(x-rad*.3,y-rad*.35,1,x,y,rad);
   g.addColorStop(0,'#49c4f4');g.addColorStop(.55,'#0784c4');g.addColorStop(1,'#045485');pc.fillStyle=g;
   pc.beginPath();pc.arc(x,y,rad,0,Math.PI*2);pc.fill();pc.strokeStyle='#064d77';pc.lineWidth=1;pc.stroke();
 });
 pc.fillStyle='#49666f';pc.font='600 14px sans-serif';pc.textAlign='center';
 pc.fillText(day===15?'粒子が水全体に均一に散らばった':day===0?'粒子が底に横長く整列している':'粒子が底から離れ、水全体へ広がっている',w/2,h-12);
}
function real(){
 let[w,h]=fit(R);rc.clearRect(0,0,w,h);let b=vessel(rc,w,h),p=day/15;
 rc.save();rc.beginPath();rc.rect(b.x,b.y,b.w,b.h);rc.clip();
 // 水そのもの
 rc.fillStyle='rgba(226,247,250,.78)';rc.fillRect(b.x,b.y,b.w,b.h);
 // 粒子モデルの広がりに対応：初期は底だけ濃い。日数とともに濃い帯が上へ広がり、同時に薄くなる。
 // 15日目には上下差のない均一な薄い青になる。
 if(p===0){
   let gh=b.h*.13, g=rc.createLinearGradient(0,b.y+b.h-gh,0,b.y+b.h);
   g.addColorStop(0,'rgba(0,155,220,0)');g.addColorStop(.48,'rgba(0,145,218,.28)');g.addColorStop(1,'rgba(0,88,190,.92)');
   rc.fillStyle=g;rc.fillRect(b.x,b.y+b.h-gh,b.w,gh);
 }else{
   const spread=.13+.87*ease(p); // 青色が届く高さ
   const topY=b.y+b.h*(1-spread);
   // 最終濃度は「均一で薄め」。途中は底ほど濃いが、その差が徐々に消える
   const uniform=.34*p;
   const bottomExtra=.72*Math.pow(1-p,1.15);
   let g=rc.createLinearGradient(0,topY,0,b.y+b.h);
   g.addColorStop(0,`rgba(0,173,224,${Math.max(.03,uniform*.75)})`);
   g.addColorStop(.45,`rgba(0,166,222,${uniform+.22*bottomExtra})`);
   g.addColorStop(1,`rgba(0,135,215,${uniform+.58*bottomExtra})`);
   rc.fillStyle=g;rc.fillRect(b.x,topY,b.w,b.y+b.h-topY);
   // 拡散境界をぼかす
   if(p<1){let haze=b.h*.12, hg=rc.createLinearGradient(0,topY-haze,0,topY+haze);hg.addColorStop(0,'rgba(0,170,225,0)');hg.addColorStop(1,`rgba(0,170,225,${.10+.12*p})`);rc.fillStyle=hg;rc.fillRect(b.x,topY-haze,b.w,haze*2)}
 }
 // 底に残る固体は粒子が底に残る割合と連動して減る
 const remaining=Math.max(0,1-ease(Math.min(1,p/0.88)));
 if(remaining>.015){
   const sedH=b.h*(.025+.075*remaining);
   rc.fillStyle=`rgba(0,76,174,${.22+.70*remaining})`;
   rc.beginPath();rc.ellipse(b.x+b.w/2,b.y+b.h-3,b.w*(.18+.25*remaining),Math.max(2,sedH),0,0,Math.PI*2);rc.fill();
 }
 rc.restore();
 rc.strokeStyle='rgba(65,151,177,.55)';rc.beginPath();rc.ellipse(b.x+b.w/2,b.y,b.w/2,5,0,0,Math.PI*2);rc.stroke();
 rc.fillStyle='#49666f';rc.font='600 14px sans-serif';rc.textAlign='center';
 
}
function update(){slider.value=day;label.textContent=day+'日目';document.querySelector('#prev').disabled=day===0;document.querySelector('#next').disabled=day===15;msg.textContent=day===0?'まだ多くの粒子が底に集まっています。':day<6?'底の粒子が少しずつ離れ、水中へ広がっています。':day<15?'見えなくなった物質も、粒子として水の中に存在しています。':'15日目：粒子は水全体に広がり、見た目もほぼ均一になりました。';particle();real()}
document.querySelector('#next').onclick=()=>{if(day<15){day++;update()}};document.querySelector('#prev').onclick=()=>{if(day>0){day--;update()}};document.querySelector('#reset').onclick=()=>{day=0;stop();update()};slider.oninput=e=>{day=+e.target.value;stop();update()};function stop(){if(timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='▶ 自動再生'}}document.querySelector('#play').onclick=()=>{if(timer){stop();return}if(day===15)day=0;document.querySelector('#play').textContent='⏸ 停止';update();timer=setInterval(()=>{if(day<15){day++;update()}else stop()},650)};window.addEventListener('resize',update);update();
</script></body></html>
